name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
          POSTGRES_DB: auth_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auth-service/package-lock.json

      - name: Install dependencies
        working-directory: auth-service
        run: npm ci

      - name: Create test database schema
        run: |
          PGPASSWORD=auth_pass psql -h localhost -U auth_user -d auth_db_test -c "
            CREATE TABLE users (
              id SERIAL PRIMARY KEY,
              email VARCHAR(255) UNIQUE NOT NULL,
              password_hash VARCHAR(255) NOT NULL,
              role VARCHAR(50) NOT NULL DEFAULT 'customer',
              auth0_sub VARCHAR(255) UNIQUE,
              created_at TIMESTAMP DEFAULT NOW()
            );

            CREATE TABLE refresh_tokens (
              id SERIAL PRIMARY KEY,
              user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
              token_hash VARCHAR(255) UNIQUE NOT NULL,
              expires_at TIMESTAMP NOT NULL,
              revoked_at TIMESTAMP NULL,
              created_at TIMESTAMP DEFAULT NOW(),
              replaced_by INTEGER REFERENCES refresh_tokens(id)
            );"
      - name: Verify schema was created correctly
        run: |
          PGPASSWORD=auth_pass psql -h localhost -U auth_user -d auth_db_test -c "\d users"
          PGPASSWORD=auth_pass psql -h localhost -U auth_user -d auth_db_test -c "\d refresh_tokens"

      - name: Run tests
        working-directory: auth-service
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: auth_user
          DB_PASSWORD: auth_pass
          DB_NAME_TEST: auth_db_test
          JWT_CURRENT_SECRET: test-current-secret-32-characters-long
          AUTH0_DOMAIN: test-tenant.auth0.com
          AUTH0_AUDIENCE: https://test-api.example.com
        run: npm test

  database-integration:
    name: Restricted-role database and Saga integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHASE2_INTEGRATION: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            orders-service/package-lock.json
            inventory-service/package-lock.json
            payments-service/package-lock.json
            catalog-service/package-lock.json

      - name: Install database-service dependencies
        run: |
          npm ci --prefix orders-service
          npm ci --prefix inventory-service
          npm ci --prefix payments-service
          npm ci --prefix catalog-service

      - name: Check dedicated Compose tooling
        run: docker compose version

      - name: Provision canonical isolated test databases and search
        run: node scripts/phase2/prepare-test-databases.js --start

      - name: Verify migration safety and restricted permissions on PostgreSQL
        env:
          PHASE21_POSTGRES: "true"
        run: node --test scripts/phase2/tests/provisioning.test.js scripts/phase2/tests/run-tests.test.js

      # Sequential execution: Orders' Saga suite shares all three service databases.
      - name: Run Orders including cross-service Saga integration
        run: node scripts/phase2/run-tests.js orders --ci --json --outputFile="$RUNNER_TEMP/orders-results.json"

      - name: Run Payments including restricted-role integration
        run: node scripts/phase2/run-tests.js payments --ci --json --outputFile="$RUNNER_TEMP/payments-results.json"

      - name: Require Saga and restricted Payments tests to have executed
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const assert = require('assert/strict');
          for (const [service, filename, minimum] of [
            ['orders', 'phase2.integration.test.js', 10],
            ['payments', 'restrictedRole.integration.test.js', 6],
          ]) {
            const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, `${service}-results.json`), 'utf8'));
            assert.equal(report.success, true, `${service}: suite failed`);
            assert.equal(report.numPendingTests, 0, `${service}: skipped tests`);
            const suite = report.testResults.find(result => path.basename(result.name) === filename);
            assert.ok(suite, `${filename}: missing report`);
            assert.ok(suite.assertionResults.length >= minimum, `${filename}: integration scenarios missing`);
            assert.ok(suite.assertionResults.every(result => result.status === 'passed'), `${filename}: unexecuted or failed scenarios`);
            console.log(`${filename}: ${suite.assertionResults.length} integration scenarios passed`);
          }
          NODE

      - name: Run Inventory with restricted application credentials
        run: node scripts/phase2/run-tests.js inventory --ci

      - name: Run Catalog with isolated PostgreSQL and Elasticsearch
        run: node scripts/phase2/run-tests.js catalog --ci

      # No secret-file/container-inspect artifacts or automatic live RabbitMQ replay.
      # Hosted-runner resources expire with the job; no volumes/databases are deleted here.

  cart-service:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cart-service/package-lock.json

      - name: Install dependencies
        working-directory: cart-service
        run: npm ci

      - name: Run tests
        working-directory: cart-service
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          CATALOG_SERVICE_URL: http://localhost:4001
          JWT_CURRENT_SECRET: test-current-secret-32-characters-long
        run: npm test

  gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        working-directory: gateway
        run: npm ci

      - name: Run tests
        working-directory: gateway
        run: npm test
