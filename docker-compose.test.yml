name: ecommerce-phase21-test
services:
  orders-test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: phase21_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_DB: postgres
    secrets:
      - source: orders-admin
        target: admin-password
    ports: ["127.0.0.1:55435:5432"]
    volumes: ["orders-test-data:/var/lib/postgresql/data"]
    networks: [test-postgres-access]
    healthcheck: &health
      test: ["CMD-SHELL", "pg_isready -U phase21_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  inventory-test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: phase21_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_DB: postgres
    secrets:
      - source: inventory-admin
        target: admin-password
    ports: ["127.0.0.1:55437:5432"]
    volumes: ["inventory-test-data:/var/lib/postgresql/data"]
    networks: [test-postgres-access]
    healthcheck: *health
  payments-test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: phase21_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_DB: postgres
    secrets:
      - source: payments-admin
        target: admin-password
    ports: ["127.0.0.1:55436:5432"]
    volumes: ["payments-test-data:/var/lib/postgresql/data"]
    networks: [test-postgres-access]
    healthcheck: *health
  catalog-test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: phase21_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
      POSTGRES_DB: postgres
    secrets:
      - source: catalog-admin
        target: admin-password
    ports: ["127.0.0.1:55438:5432"]
    volumes: ["catalog-test-data:/var/lib/postgresql/data"]
    networks: [test-postgres-access]
    healthcheck: *health
  catalog-test-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:59200:9200"]
    volumes: ["catalog-test-es-data:/usr/share/elasticsearch/data"]
    networks: [test-postgres-access]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

secrets:
  orders-admin:
    file: ${PHASE21_SECRET_DIR:?Set PHASE21_SECRET_DIR}/orders-admin
  inventory-admin:
    file: ${PHASE21_SECRET_DIR:?Set PHASE21_SECRET_DIR}/inventory-admin
  payments-admin:
    file: ${PHASE21_SECRET_DIR:?Set PHASE21_SECRET_DIR}/payments-admin
  catalog-admin:
    file: ${PHASE21_SECRET_DIR:?Set PHASE21_SECRET_DIR}/catalog-admin
volumes:
  catalog-test-es-data:
  orders-test-data:
  inventory-test-data:
  payments-test-data:
  catalog-test-data:
networks:
  test-postgres-access:
    driver: bridge
