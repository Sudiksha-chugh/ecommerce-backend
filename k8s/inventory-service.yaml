apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: inventory-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          image: docker.io/sudikshachugh/inventory-service:nonroot-v1
          imagePullPolicy: Never

          envFrom:
            - secretRef:
                name: inventory-service-secret

          env:
            - name: DB_HOST
              value: inventory-db
            - name: DB_PORT
              value: "5432"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: inventory-url
            - name: PORT
              value: "4005"
            - name: ES_NODE
              value: http://elasticsearch:9200
            - name: RESERVATION_EXPIRATION_MINUTES
              value: "15"
            - name: INVENTORY_EXPIRATION_INTERVAL_MS
              value: "60000"
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                    name: internal-service-secret
                    key: INTERNAL_SERVICE_KEY
          ports:
            - containerPort: 4005

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 4005
      targetPort: 4005
