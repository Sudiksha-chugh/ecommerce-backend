apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secret
type: Opaque
stringData:
  JWT_SECRET: super-secret-dev-key-change-in-prod
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: orders_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: sudikshachugh/orders-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: orders-service-secret
          env:
            - name: DB_HOST
              value: orders-db
            - name: DB_PORT
              value: "5432"
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: PORT
              value: "4003"
          ports:
            - containerPort: 4003
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
spec:
  selector:
    app: orders-service
  ports:
    - port: 4003
      targetPort: 4003