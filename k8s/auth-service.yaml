apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
type: Opaque
stringData:
  JWT_SECRET: super-secret-dev-key-change-in-prod
  DB_USER: auth_user
  DB_PASSWORD: auth_pass
  DB_NAME: auth_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: sudikshachugh/auth-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: auth-service-secret
          env:
            - name: DB_HOST
              value: auth-db
            - name: DB_PORT
              value: "5432"
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 4000
      targetPort: 4000