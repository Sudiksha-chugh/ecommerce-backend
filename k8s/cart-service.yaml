apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cart-service
          image: docker.io/sudikshachugh/cart-service:nonroot-v1
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          envFrom:
            - secretRef:
                name: cart-service-secret

          env:
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cart-service-secret
                  key: AUTH0_DOMAIN

            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: cart-service-secret
                  key: AUTH0_AUDIENCE

            - name: AUTH_SERVICE_URL
              value: http://auth-service:4000

            - name: REDIS_URL
              value: redis://redis:6379
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:4001
            - name: PORT
              value: "4002"
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: INTERNAL_SERVICE_KEY

          ports:
            - containerPort: 4002

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
spec:
  selector:
    app: cart-service
  ports:
    - port: 4002
      targetPort: 4002
