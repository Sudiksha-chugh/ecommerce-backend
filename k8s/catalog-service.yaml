apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: sudikshachugh/catalog-service:local
          imagePullPolicy: Never

          envFrom:
            - secretRef:
                name: catalog-service-secret

          env:
            - name: DB_HOST
              value: catalog-db
            - name: DB_PORT
              value: "5432"
            - name: ES_NODE
              value: http://elasticsearch:9200
            - name: PORT
              value: "4001"
            - name: RESERVATION_EXPIRATION_MINUTES
              value: "15"
            - name: INVENTORY_EXPIRATION_INTERVAL_MS
              value: "60000"
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                    name: internal-service-secret
                    key: INTERNAL_SERVICE_KEY
          ports:
            - containerPort: 4001

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - port: 4001
      targetPort: 4001
