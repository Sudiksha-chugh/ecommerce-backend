apiVersion: v1
kind: Secret
metadata:
  name: catalog-service-secret
type: Opaque
stringData:
  JWT_SECRET: super-secret-dev-key-change-in-prod
  DB_USER: catalog_user
  DB_PASSWORD: catalog_pass
  DB_NAME: catalog_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: sudikshachugh/catalog-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: catalog-service-secret
          env:
            - name: DB_HOST
              value: catalog-db
            - name: DB_PORT
              value: "5432"
            - name: ES_NODE
              value: http://elasticsearch:9200
            - name: PORT
              value: "4001"
          ports:
            - containerPort: 4001
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - port: 4001
      targetPort: 4001