apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: gateway
          image: docker.io/sudikshachugh/gateway:nonroot-v1

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent

          env:
            - name: PORT
              value: "8080"

            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth0-secret
                  key: AUTH0_DOMAIN

            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: gateway-auth0-secret
                  key: AUTH0_AUDIENCE

            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gateway-auth0-secret
                  key: AUTH0_CLIENT_ID

            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-auth0-secret
                  key: AUTH0_CLIENT_SECRET

            - name: AUTH0_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-auth0-secret
                  key: AUTH0_CALLBACK_URL

            - name: AUTH_SERVICE_URL
              value: http://auth-service:4000

            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:4001

            - name: CART_SERVICE_URL
              value: http://cart-service:4002

            - name: ORDERS_SERVICE_URL
              value: http://orders-service:4003

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080